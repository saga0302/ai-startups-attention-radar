version: 2

models:
  - name: pageviews_silver_daily
    description: "Daily views per AI company."
    columns:
      - name: entity_id
        tests: [not_null]
      - name: day_utc
        tests: [not_null]
      - name: views
        tests: [not_null]

  - name: pageviews_zscore
    description: "Daily z-score per AI company against its own trailing 30 full days."
    columns:
      - name: entity_id
        tests: [not_null]
      - name: day_utc
        tests: [not_null]

  - name: flagged_days
    description: "Gold table: days a company was flagged as a spike or a drop, with the z-score."
    columns:
      - name: entity_id
        tests: [not_null]
      - name: day_utc
        tests: [not_null]
      - name: direction
        tests:
          - accepted_values:
              arguments:
                values: ['spike', 'drop']
