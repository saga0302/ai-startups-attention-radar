# Connection settings. Secrets come from environment variables, never from this file.
# Set DATABRICKS_HOST, DATABRICKS_HTTP_PATH and DATABRICKS_TOKEN before running dbt.
attention_radar:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: workspace
      schema: default
      threads: 4
