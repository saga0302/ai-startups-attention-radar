# Override for the official Apache Airflow 2.x docker-compose layout.
#
# Usage (from the folder that holds your docker-compose.yaml):
#   docker compose -f docker-compose.yaml -f docker-compose.restart.yml up -d
#
# What it does: every long-running service restarts automatically when the
# Docker daemon starts again, instead of staying stopped. "unless-stopped" keeps
# services down only if you stop them yourself with `docker compose stop`.
#
# Service names must match your docker-compose.yaml. Compose errors on unknown
# services, so remove any line whose service you do not have.

services:
  postgres:
    restart: unless-stopped
  airflow-init:
    restart: "no"          # one-shot DB migration / user creation; must not restart
  airflow-webserver:
    restart: unless-stopped
  airflow-scheduler:
    restart: unless-stopped
  airflow-triggerer:
    restart: unless-stopped
